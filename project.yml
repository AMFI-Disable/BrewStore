name: BrewStore
options:
  bundleIdPrefix: com.amfi-disable
targets:
  BrewStore:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: sources
      - path: sources/resources/appicon.icns
    preBuildScripts:
      - name: Sync Asset Catalog Contents.json Casing
        script: |
          find "${SRCROOT}/sources/resources/assets.xcassets" -name "contents.json" -exec sh -c 'mv "$1" "$(dirname "$1")/Contents.json"' _ {} \;
    copyFiles:
      - destination: resources
        subpath: scripts
        files:
          - scripts/brewstore
          - scripts/brewstore-agent.sh
    settings:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_ENTITLEMENTS: sources/resources/brewstore.entitlements
      INFOPLIST_FILE: sources/resources/info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.amfi-disable.brewstore
      PRODUCT_NAME: BrewStore
      ARCHS: arm64
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: appicon
      ENABLE_HARDENED_RUNTIME: YES
  BrewStoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: tests
    dependencies:
      - target: BrewStore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.amfi-disable.brewstore.tests
      ARCHS: arm64
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BrewStore.app/Contents/MacOS/BrewStore"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BrewStore:
    build:
      targets:
        BrewStore: all
    test:
      targets:
        - BrewStoreTests
