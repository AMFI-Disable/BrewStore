name: "CI: Build and Test BrewStore"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality:
    name: Fast Offline Quality Checks
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate YAML Files
        run: |
          ruby -ryaml -e '
            Dir.glob(".github/**/*.{yml,yaml}").each do |f|
              YAML.safe_load(File.read(f))
              puts "Validated: #{f}"
            end
          '

      - name: Verify Lowercase Filenames
        run: |
          if git ls-files | grep '[A-Z]'; then
            echo "Error: uppercase tracked files found"
            exit 1
          fi
          echo "All tracked files are lowercase."

      - name: Verify Commit Message Conventions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -c '
          import subprocess, re, os
          pattern = re.compile(r"^[a-z]+: [a-z0-9]+ [a-z0-9]+ [a-z0-9]+$")
          base_sha = os.environ.get("BASE_SHA", "")

          if base_sha and not re.match(r"^0+$", base_sha):
              rev_range = f"{base_sha}..HEAD"
          else:
              rev_range = "HEAD~1..HEAD"

          try:
              commits = subprocess.check_output(["git", "log", rev_range, "--format=%H %s"]).decode().strip().split("\n")
          except Exception:
              commits = subprocess.check_output(["git", "log", "-1", "--format=%H %s"]).decode().strip().split("\n")

          commits = [c for c in commits if c.strip()]
          for c in commits:
              sha, msg = c.split(" ", 1)
              if msg.startswith("Merge "):
                  continue
              if not pattern.match(msg):
                  raise SystemExit(f"Invalid commit message {sha[:7]}: {msg}")
          print(f"Validated {len(commits)} commit messages.")
          '

  build-and-test:
    name: Build & Test macOS Application
    runs-on: macos-14
    needs: [ quality ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -r | head -1)/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build macOS Application
        run: |
          xcodebuild build \
            -project BrewStore.xcodeproj \
            -scheme BrewStore \
            -sdk macosx \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project BrewStore.xcodeproj \
            -scheme BrewStore \
            -sdk macosx \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
